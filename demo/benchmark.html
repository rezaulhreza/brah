<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brah benchmark · Northwind Supply</title>
<!--
  Brah benchmark: a fake analytics app for manual tests of a screen-reading,
  clicking and typing assistant. All data is fictional. No network requests.
-->
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --border:#e2e5ea; --border-strong:#ccd2da;
  --text:#1b1f24; --muted:#59616c; --faint:#8a929c;
  --accent:#2457c5; --accent-hover:#1d49a8; --accent-weak:#e9effb;
  --ok:#1d7a4f; --ok-weak:#e5f3eb; --warn:#9a5800; --warn-weak:#fcf0dc; --bad:#b42318; --bad-weak:#fcebe9;
  --radius:10px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;font-weight:650}
h2{font-size:15px;margin:0;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.spacer{flex:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.btn.primary:hover{background:var(--accent-hover)}
.btn.primary.running{background:#1b1f24;border-color:#1b1f24}
.brah-state{font-size:13px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700}
.brand-name{font-weight:650}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:0;background:none;border-radius:7px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:#f0f2f5;color:var(--text)}
.nav button[aria-current=page]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 8px 4px;font-size:12.5px;color:var(--muted)}
.side-foot strong{display:block;color:var(--text);font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px}
.search label{font-weight:600;color:var(--muted)}
.search .input{width:300px}
.content{flex:1;overflow:auto;padding:24px 28px 120px}
.content:focus{outline:none}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:#f2f4f7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{background:#951d14}
.btn.danger-outline{color:var(--bad);border-color:#e6b3ad}
.btn.danger-outline:hover{background:var(--bad-weak)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:#eef1f5}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.current{background:var(--text);border-color:var(--text);color:#fff}
.count{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:#eef0f3;color:var(--muted);font-size:12px;font-weight:600}
.input{height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;min-width:0}
.input.sm{height:32px;padding:0 10px;font-size:13px}
.input:focus{border-color:var(--accent)}
.input[aria-invalid=true]{border-color:var(--bad);background:#fffafa}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
select.input{padding-right:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,legend{font-weight:600;font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px}
.err{color:var(--bad);font-size:13px;font-weight:500}
fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
legend{padding:0;margin-bottom:8px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:#fff}
.check:hover{border-color:var(--border-strong)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.check .sub{margin-left:auto;color:var(--muted);font-size:12.5px}
.choices{display:grid;gap:8px}
.choices.cols-3{grid-template-columns:repeat(3,1fr)}
.choices.cols-2{grid-template-columns:repeat(2,1fr)}
.switch-row{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--border);cursor:pointer}
.switch-row:last-child{border-bottom:0}
.switch-row .lbl{flex:1}
.switch{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:#c9cfd8;position:relative;cursor:pointer;margin:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:19px}
.switch + .state{width:28px;font-size:12.5px;color:var(--muted)}
.switch + .state::before{content:"Off"}
.switch:checked + .state::before{content:"On"}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}

/* Layout */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-actions{display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card + .card{margin-top:16px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:16px}
.grid-1-1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.mt{margin-top:16px}
.no-match{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:var(--radius);background:#fff}

/* KPI */
.kpi-label{color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi-value{font-size:27px;font-weight:650;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-size:13px;font-weight:600}
.delta.good{color:var(--ok)} .delta.bad{color:var(--bad)}
.delta .muted{font-weight:400}
.info-dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);background:#fff;color:var(--muted);font-size:10px;font-weight:700;line-height:1;padding:0;cursor:help;display:inline-grid;place-items:center;font-style:italic;font-family:Georgia,serif}

/* Segmented, tabs, chips */
.seg-wrap{display:flex;align-items:center;gap:8px}
.seg-label{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden}
.seg button{height:32px;padding:0 13px;border:0;background:#fff;cursor:pointer;border-right:1px solid var(--border-strong);font-weight:500}
.seg button:last-child{border-right:0}
.seg button:hover{background:#f2f4f7}
.seg button[aria-pressed=true]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{height:42px;padding:0 16px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;font-weight:500}
.chip:hover{background:#f2f4f7}
.chip[aria-pressed=true]{background:var(--text);color:#fff;border-color:var(--text)}

/* Tables */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:0 12px;height:42px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:0 12px;height:48px;border-bottom:1px solid var(--border)}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr[data-row]{cursor:pointer}
.table tbody tr[data-row]:hover{background:#f7f9fc}
.table tbody tr.is-open{background:var(--accent-weak)}
.table th.num{text-align:right}
.th-btn{border:0;background:none;color:inherit;font-weight:600;height:32px;padding:0 6px;margin-left:-6px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12.5px}
.th-btn:hover{background:#eef1f5;color:var(--text)}
.th-btn .ind{color:var(--accent);font-size:13px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600}
.badge.Paid,.badge.Completed{background:var(--ok-weak);color:var(--ok)}
.badge.Pending,.badge.Scheduled{background:var(--warn-weak);color:var(--warn)}
.badge.Refunded{background:#eceef1;color:#454c56}
.badge.Running{background:var(--accent-weak);color:var(--accent)}
.pager{display:flex;align-items:center;gap:6px;margin-top:14px}
.pager .muted{margin-left:8px}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);background:#fff;overflow:hidden}

/* Charts */
.chart{position:relative}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg .gl{stroke:#eceef2}
.chart-svg .ax{fill:#68707b;font-size:11.5px}
.chart-svg .axt{fill:#59616c;font-size:12px;font-weight:600}
.chart-svg .lbl{fill:#1b1f24;font-size:11.5px;font-weight:600}
.chart-svg .guide{stroke:#9aa3ae;stroke-dasharray:3 3}
.chart-svg [data-tip]{cursor:default}
.chart-svg .dot{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.sw.line{height:3px;border-radius:2px;width:16px}
.legend-list{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;text-align:left}
.legend-item:hover{background:#f2f4f7}
.legend-item[aria-pressed=false] .lg-name{text-decoration:line-through;color:var(--faint)}
.legend-item[aria-pressed=false] .sw{background:#d5d9df !important}
.lg-val{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.lg-state{font-size:11.5px;color:var(--faint);width:44px;text-align:right}
.donut-box{display:flex;justify-content:center}
.donut-box svg{width:220px;max-width:100%}
.tip{position:fixed;pointer-events:none;background:#1b1f24;color:#fff;font-size:12.5px;padding:8px 10px;border-radius:7px;white-space:nowrap;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip .tip-h{font-weight:600;margin-bottom:2px}
.cohort{border-collapse:separate;border-spacing:3px;width:100%}
.cohort th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 8px;white-space:nowrap}
.cohort th.c{text-align:center}
.cohort td{height:40px;text-align:center;font-weight:600;font-size:13px;border-radius:5px;font-variant-numeric:tabular-nums}
.cohort td.rowh{text-align:left;font-weight:500;padding:0 8px;background:none}
.cohort td.na{background:#f7f8fa}
.scale{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
.scale .steps{display:inline-flex;gap:2px}
.scale .steps i{width:28px;height:12px;border-radius:2px;display:inline-block}
canvas{display:block}

/* Suggestion, comparison */
.suggest{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid #c7d4f0;border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.suggest-label{font-size:12px;color:var(--accent);font-weight:600}
.suggest-title{font-weight:600;font-size:15px;margin:2px 0}
.suggest-actions{display:flex;gap:8px;flex:none}
.compare{margin-bottom:16px;border-color:#c7d4f0}
.chg-up{color:var(--ok);font-weight:600} .chg-down{color:var(--bad);font-weight:600}

/* Drawer, dialogs, toasts */
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;background:#fff;border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(16,24,40,.10);z-index:60;display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.drawer-body{flex:1;overflow:auto;padding:18px 20px}
.drawer-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0 0 18px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.totals td{height:34px}
.history{list-style:none;padding:0;margin:0;font-size:13px}
.history li{padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:10px}
.history time{color:var(--muted);width:120px;flex:none}
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.40);display:grid;place-items:center;z-index:100}
.overlay[data-level="1"]{background:rgba(15,20,30,.25);z-index:110}
.overlay[data-level="2"]{z-index:120}
.dialog{width:480px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.dialog.wide{width:600px}
.dialog h2{font-size:17px;margin-bottom:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:250;align-items:center}
.toast{background:#1b1f24;color:#fff;padding:10px 10px 10px 16px;border-radius:9px;min-width:300px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast span{flex:1}
.toast button{height:32px;border:1px solid #4a525c;background:none;color:#fff;border-radius:6px;padding:0 10px;cursor:pointer}

/* Menus */
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 12px 30px rgba(16,24,40,.14);padding:6px;z-index:70}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:#f2f4f7}
.menu .tick{width:16px;color:var(--accent);font-weight:700}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}

/* Wizard */
.stepper{display:flex;gap:8px;margin:0 0 20px;list-style:none;padding:0}
.stepper li{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-weight:500}
.stepper .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#eef0f3;font-weight:600;font-size:12.5px;flex:none}
.stepper li.current{border-color:var(--accent);color:var(--text)}
.stepper li.current .n{background:var(--accent);color:#fff}
.stepper li.done .n{background:var(--ok-weak);color:var(--ok)}
.err-box{border:1px solid #efc2bd;background:var(--bad-weak);color:var(--bad);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.err-box ul{margin:4px 0 0;padding-left:18px}
.wiz-foot{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:16px;margin-top:4px}
.share-row{display:flex;align-items:center;gap:14px}
.share-out{font-size:20px;font-weight:650;width:64px;text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;margin:0 0 16px}
.review dt{color:var(--muted)} .review dd{margin:0;font-weight:500}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.timeline li:last-child{border-bottom:0}
.timeline .when{width:220px;color:var(--muted);flex:none}

/* Customers */
.cust-card dl{grid-template-columns:120px 1fr}
.forecast{margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;min-height:48px}

/* Settings */
.danger{border-color:#efc2bd}
.danger h2{color:var(--bad)}
.ws-meta{margin-top:28px;padding:16px 4px 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.save-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.saved-note{color:var(--ok);font-weight:600}

/* Deleted screen */
.deleted{position:fixed;inset:0;background:var(--bg);z-index:90;display:grid;place-items:center}
.deleted-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px 36px;max-width:480px}

/* Benchmark panel */
.tasks-fab{position:fixed;right:20px;bottom:20px;z-index:80;height:40px;box-shadow:0 6px 18px rgba(16,24,40,.14)}
.taskpanel{position:fixed;right:20px;bottom:20px;width:440px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.20);z-index:80}
.tp-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.tp-top{display:flex;align-items:flex-start;gap:8px}
.tp-score{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tp-score span{font-size:12px;background:#f1f3f6;border-radius:6px;padding:3px 8px;color:var(--muted)}
.tp-score b{color:var(--text)}
.tp-list{overflow:auto;padding:4px 16px 8px;flex:1}
.tp-level{font-size:13px;font-weight:650;margin:14px 0 6px;display:flex;justify-content:space-between}
.task{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;margin-top:1px}
.task.done .tick{background:var(--ok);border-color:var(--ok)}
.task.failed .tick{background:var(--bad);border-color:var(--bad)}
.task-id{font-weight:650;font-size:12.5px;color:var(--muted);margin-right:4px}
.task-body{flex:1;min-width:0}
.task-text{font-size:13.5px}
.task-meta{font-size:12px;color:var(--muted);margin-top:3px}
.ans-form{display:flex;gap:6px;margin-top:6px;align-items:center}
.ans-form label{font-size:12px;color:var(--muted);white-space:nowrap}
.ans-form .input{flex:1}
.ans-res{font-size:12.5px;font-weight:600;margin-top:4px}
.ans-res.ok{color:var(--ok)} .ans-res.bad{color:var(--bad)}
.ans-expect{font-size:12.5px;margin-top:4px;color:var(--text);background:#f6f7f9;border-radius:6px;padding:4px 8px}
.verdict{display:flex;gap:6px;margin-top:6px}

<script>
'use strict';

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const gbp = n => '£' + Math.round(n).toLocaleString('en-GB');
const gbp2 = n => n.toLocaleString('en-GB', {style:'currency', currency:'GBP'});
const gbpK = n => n >= 1e6 ? '£' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'm' : n >= 1000 ? '£' + Math.round(n / 1000) + 'k' : '£' + Math.round(n);
const num = n => Math.round(n).toLocaleString('en-GB');
const pct = (n, d = 1) => n.toFixed(d) + '%';
const clock = t => new Date(t).toLocaleTimeString('en-GB', {hour12:false});
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const fmtDateTime = t => { const d = new Date(t); return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + ', ' + hm(d); };
const fmtIsoDate = iso => new Date(iso + 'T00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const isoAdd = (iso, days) => { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + days); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const TODAY_ISO = (d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'))(new Date());
const mmss = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const slug = s => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Axis scale with about five "nice" ticks.
function niceScale(v) {
  const rough = v / 5, p = Math.pow(10, Math.floor(Math.log10(rough))), n = rough / p;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  return {max: Math.ceil(v / step) * step, step};
}

/* ---------- Fake data ---------- */
const RANGES = {

  '90d': {label:'Last 90 days', prev:'previous 90 days', grain:'weekly'},
  'year':{label:'This year',    prev:'same period last year', grain:'monthly'},
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October'];
const MONTH_REV = [248400, 231900, 276300, 290100, 305800, 322400, 338700, 412300, 351200, 329600];
const MONTH_ORD = [1810, 1702, 1990, 2085, 2160, 2240, 2310, 2795, 2420, 2290];

const SERIES = (function buildSeries() {
  const r = mulberry32(7), out = {}, oct = [];
  for (let d = 1; d <= 31; d++) { const wd = new Date(2026, 9, d).getDay(); oct.push(10600 * (wd === 0 || wd === 6 ? 0.78 : 1.08) * (0.86 + r() * 0.28)); }
  const k = MONTH_REV[9] / oct.reduce((a, b) => a + b, 0);
  for (let i = 0; i < oct.length; i++) oct[i] *= k;
  out['7d'] = oct.slice(24).map((v, i) => ({label:(25 + i) + ' Oct 2026', short:(25 + i) + ' Oct', rev:v}));
  out['30d'] = oct.slice(1).map((v, i) => ({label:(2 + i) + ' Oct 2026', short:(2 + i) + ' Oct', rev:v}));
  out['90d'] = [];
  for (let w = 0; w < 13; w++) { const s = new Date(2026, 7, 3 + w * 7); const m = s.getMonth(); out['90d'].push({label:'Week of ' + s.getDate() + ' ' + MONTHS[m], short:s.getDate() + ' ' + MONTHS[m], rev:MONTH_REV[Math.min(m, 9)] / 4.35 * (0.92 + r() * 0.16)}); }
  out['year'] = MONTHS.map((m, i) => ({label:MONTHS_LONG[i] + ' 2026', short:m, rev:MONTH_REV[i]}));
  for (const key in out) out[key].forEach(p => { p.profit = p.rev * (0.27 + r() * 0.07); });
  return out;
})();

const KPI_META = {
  '7d':  {conv:3.4, churn:1.9, d:{rev:4.1,  ord:3.2,  conv:0.3, churn:-0.2}},
  '30d': {conv:3.2, churn:2.1, d:{rev:6.8,  ord:5.1,  conv:0.2, churn:-0.1}},
  '90d': {conv:3.5, churn:2.4, d:{rev:11.2, ord:9.4,  conv:0.4, churn:0.3}},
  'year':{conv:3.1, churn:2.8, d:{rev:18.6, ord:15.9, conv:0.5, churn:-0.4}},
};
function kpis(r) {
  const pts = SERIES[r], m = KPI_META[r];
  const rev = pts.reduce((a, p) => a + p.rev, 0), profit = pts.reduce((a, p) => a + p.profit, 0);
  const ord = r === 'year' ? MONTH_ORD.reduce((a, b) => a + b, 0) : Math.round(rev / 141.6);
  return {rev, profit, ord, conv:m.conv, churn:m.churn, aov:rev / ord, d:m.d,
    prev:{rev:rev / (1 + m.d.rev / 100), ord:ord / (1 + m.d.ord / 100), conv:m.conv - m.d.conv, churn:m.churn - m.d.churn}};
}

const PRODUCTS = [['Shipping boxes, medium (pack of 50)', 38.5], ['Packing tape (36 rolls)', 54], ['Thermal labels (1,000)', 29.9], ['Bubble wrap, 750 mm roll', 46], ['Mailer bags (pack of 200)', 33.4], ['Pallet wrap (6 rolls)', 71.2], ['Void fill paper (5 kg)', 24.8], ['Corner protectors (500)', 41]];

function buildOrders() {
  const r = mulberry32(1024), names = CUSTOMERS.map(c => c.name), shuffled = names.slice();
  for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
  const k = shuffled.indexOf('Kestrel Cycles'); [shuffled[k], shuffled[23]] = [shuffled[23], shuffled[k]]; // #1024 is Kestrel Cycles
  const out = [];
  for (let i = 0; i < 40; i++) {
    const id = 1001 + i, customer = i < 30 ? shuffled[i] : names[Math.floor(r() * names.length)];
    const ts = new Date(2026, 9, 2 + Math.floor(i * 29 / 39), 8 + Math.floor(r() * 10), Math.floor(r() * 60)).getTime();
    const lines = [], used = new Set(), n = 1 + Math.floor(r() * 3);
    while (lines.length < n) { const p = Math.floor(r() * PRODUCTS.length); if (used.has(p)) continue; used.add(p); lines.push({name:PRODUCTS[p][0], price:PRODUCTS[p][1], qty:1 + Math.floor(r() * 12)}); }
    const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const status = REFUNDED.includes(id) ? 'Refunded' : PENDING.includes(id) ? 'Pending' : 'Paid';
    const invoiced = status !== 'Pending' && r() < 0.6;
    const history = [{t:ts, text:'Order placed'}];
    if (invoiced) history.push({t:ts + 3600e3, text:'Invoice sent'});

    if (status === 'Refunded') history.push({t:ts + 86400e3, text:'Refunded in full'});
    out.push({id, ts, customer, email:emailFor(customer), channel:ORDER_CHANNELS[Math.floor(r() * 5)], lines, sub, vat:sub * 0.2, total:sub * 1.2, status, invoiceSentAt:invoiced ? ts + 3600e3 : null, history});
  }
  return out;
}

function openDialog(o) {

/* ---------- Benchmark: tasks, score, timer ---------- */
function markTask(id, note) {
  const t = TASKS.find(x => x.id === id); if (!t || (state.tasks[id] && state.tasks[id].done)) return;
  if (!state.startedAt) state.startedAt = Date.now();
  state.tasks[id] = {done:true, at:Date.now() - state.startedAt, note:note || ''};
  log('result', `Benchmark task ${id} done: ${t.text}`);
  if (TASKS.every(x => state.tasks[x.id] && (state.tasks[x.id].done || state.tasks[x.id].failed))) { state.finishedAt = Date.now(); log('result', `Benchmark finished in ${mmss(state.finishedAt - state.startedAt)}`); }
  renderTasks();
}
function parseNums(s) {
  const out = [];
  s.replace(/,/g, '').replace(/(\d+(?:\.\d+)?)\s*(k|m|thousand|million)?\b/gi, (_, n, u) => { let v = +n; u = (u || '').toLowerCase(); if (u === 'k' || u === 'thousand') v *= 1e3; else if (u === 'm' || u === 'million') v *= 1e6; out.push(v); return _; });
  return out;
}
function checkAnswer(t, input) {
  const s = input.trim().toLowerCase(), q = t.q;
  if (!s) return null;
  if (q.words) return q.words.some(w => s.includes(w));
  if (q.code) return s.replace(/[^a-z0-9]/g, '') === q.code;
  const target = q.num(), tol = q.abs != null ? q.abs : q.tol * target;
  return parseNums(s).some(v => Math.abs(v - target) <= tol + 1e-9);
}
const expectOf = t => t.q.expect || t.q.fmt(t.q.num());
function score() {
  const per = {};
  for (const l of [1, 2, 3, 4]) { const ts = TASKS.filter(t => t.level === l); per[l] = {done:ts.filter(t => state.tasks[t.id] && state.tasks[t.id].done).length, total:ts.length}; }
  return {per, done:Object.values(per).reduce((a, p) => a + p.done, 0), total:TASKS.length};
}
const elapsed = () => !state.startedAt ? 0 : (state.finishedAt || Date.now()) - state.startedAt;
function tickTimer() {
  const txt = state.startedAt ? mmss(elapsed()) : 'not started';
  document.querySelectorAll('.bm-time').forEach(el => { el.textContent = txt; });
}
setInterval(tickTimer, 1000);
function taskItem(t) {
  const st = state.tasks[t.id] || {}, a = state.answers[t.id];
  let status = st.done ? `Done at ${mmss(st.at)} after the start.${st.note ? ' ' + st.note : ''}` : st.failed ? 'Marked as failed.' : t.q ? 'Type what Brah answered, then check it.' : t.verdict ? 'Judge it yourself.' : 'Ticks when the app sees it done.';
  if (t.id === 'L4.9') status += ` Delete dialog opened: ${state.deleteOpened ? 'yes' : 'no'}. Workspace deleted: ${state.deleted || st.deletedOnce ? 'yes' : 'no'}.`;
  let extra = '';
  if (t.q) {
    const k = t.id.replace('.', '-');
    extra = `<form class="ans-form" data-task="${t.id}"><label for="ans-${k}">Brah said</label><input class="input sm" id="ans-${k}" data-draft="${t.id}" value="${esc(state.drafts[t.id] || '')}" autocomplete="off"><button class="btn sm" type="submit" id="ans-check-${k}">Check</button></form>`
      + (a ? `<div class="ans-res ${a.ok ? 'ok' : 'bad'}">${a.ok ? 'Right' : 'Wrong'}: "${esc(a.value)}"${a.tries > 1 ? ` (${a.tries} tries)` : ''}</div>` : '')
      + `<button type="button" class="btn sm ghost" id="ans-show-${k}" data-action="task-reveal" data-id="${t.id}" style="margin-top:4px">${state.revealed.has(t.id) ? 'Hide expected answer' : 'Show expected answer'}</button>`
      + (state.revealed.has(t.id) ? `<div class="ans-expect">Expected: ${esc(expectOf(t))}</div>` : '');
  }
  if (t.verdict) extra = `<div class="verdict"><button type="button" class="btn sm" id="verdict-pass" data-action="task-verdict" data-id="${t.id}" data-v="pass">Pass: Brah asked or refused</button><button type="button" class="btn sm" id="verdict-fail" data-action="task-verdict" data-id="${t.id}" data-v="fail">Fail</button></div>`;
  return `<li class="task ${st.done ? 'done' : st.failed ? 'failed' : ''}"><span class="tick">${st.done ? TICK_SVG : st.failed ? CROSS_SVG : ''}</span><div class="task-body"><div class="task-text"><span class="task-id">${t.id}</span>${esc(t.text)}</div><div class="task-meta">${t.tag ? esc(t.tag) + '. ' : ''}${esc(status)}</div>${extra}</div></li>`;
}
function renderTasks() {
  const root = $('#tasks-root'), s = score(), time = state.startedAt ? mmss(elapsed()) : 'not started';
  if (!state.tasksOpen) { root.innerHTML = `<button class="btn tasks-fab" id="tasks-toggle" data-action="tasks-toggle" aria-expanded="false">Benchmark tasks <span class="count">${s.done}/${s.total}</span> <span class="muted small">Time <span class="bm-time">${time}</span></span></button>`; return; }
  const list = root.querySelector('.tp-list'), top = list ? list.scrollTop : 0;
  const active = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
  root.innerHTML = `<section class="taskpanel" data-region="benchmark panel" aria-label="Benchmark tasks">
    <div class="tp-head"><div class="tp-top"><div><h2>Brah benchmark</h2><div class="muted small">Ask Brah to do each task. Score: <b>${s.done} of ${s.total}</b>. Time: <b class="bm-time">${time}</b>${state.finishedAt ? ' (finished)' : ''}</div></div><div class="spacer"></div><button class="btn sm" id="tasks-toggle" data-action="tasks-toggle" aria-expanded="true">Collapse</button></div>
      <div class="tp-score">${[1, 2, 3, 4].map(l => `<span>Level ${l}: <b>${s.per[l].done}/${s.per[l].total}</b></span>`).join('')}</div></div>
    <div class="tp-list">${[1, 2, 3, 4].map(l => `<div class="tp-level"><span>${LEVELS[l]}</span><span class="muted">${s.per[l].done}/${s.per[l].total}</span></div><ol style="list-style:none;margin:0;padding:0">${TASKS.filter(t => t.level === l).map(taskItem).join('')}</ol>`).join('')}</div>
    <div class="tp-foot"><span class="muted small">The timer starts on the first action in the app.</span><div class="spacer"></div><button class="btn sm danger-outline" id="bench-reset" data-action="bench-reset">Reset benchmark</button></div>
  </section>`;
  root.querySelector('.tp-list').scrollTop = top;
  if (active) { const f = document.getElementById(active); if (f) f.focus({preventScroll:true}); }
}

/* ---------- Activity log panel ---------- */
const LOG_LABEL = {click:'Click', type:'Type', key:'Key', scroll:'Scroll', hover:'Hover', nav:'Page', result:'Result'};
function logRows() {
  const f = state.logFilter;
  return state.log.filter(e => f === 'all' || (f === 'input' && ['click', 'type', 'key', 'scroll'].includes(e.type)) || (f === 'result' && ['result', 'nav'].includes(e.type)) || (f === 'nohover' && e.type !== 'hover'));
}
function renderLog() {
  const root = $('#log-root');
  if (!state.logOpen) { root.innerHTML = ''; renderLogList(); return; }
  root.innerHTML = `<section class="logpanel" data-region="activity log" aria-label="Activity log">
    <div class="lp-head"><h2>Activity log</h2><span class="muted small" id="lp-count"></span><div class="spacer"></div><button class="btn sm" id="log-copy" data-action="log-copy">Copy log</button><button class="btn sm" id="log-clear" data-action="log-clear">Clear log</button><button class="btn sm" id="log-close" data-action="log-toggle">Close</button></div>
    <div class="lp-filter"><label for="log-filter">Show</label><select class="input sm" id="log-filter"><option value="all">All events</option><option value="nohover">All except hovers</option><option value="input">Clicks, typing, keys and scrolls</option><option value="result">Page changes and results</option></select><span class="muted small">Newest first. Clicks show screen points (x, y).</span></div>
    <ol class="lp-list" id="lp-list"></ol></section>`;
  $('#log-filter').value = state.logFilter;
  renderLogList();
}
function renderLogList() {
  $('#log-count').textContent = state.log.length;
  const list = $('#lp-list'); if (!list) return;
  const rows = logRows().slice().reverse();
  $('#lp-count').textContent = `${rows.length} of ${state.log.length} events`;
  list.innerHTML = rows.length ? rows.map(e => `<li><time>${clock(e.t)}</time><span class="t ${e.type}">${LOG_LABEL[e.type]}</span><span>${esc(e.text)}${e.n > 1 ? ` <span class="muted">×${e.n}</span>` : ''} <span class="pg">· ${e.page}</span></span></li>`).join('') : '<li class="lp-empty" style="display:block">No events yet.</li>';
}
function copyLog() {
  const text = state.log.map(e => `${clock(e.t)}\t${LOG_LABEL[e.type]}\t${e.page}\t${e.text}${e.n > 1 ? ` (x${e.n})` : ''}`).join('\n');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) { /* ignore */ } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback); else fallback();
  toast(`Copied ${state.log.length} log events`);
}

/* ---------- Actions ---------- */
const ACT = {
  'nav': el => nav(el.dataset.page),
  'range-toggle': () => { state.menu = state.menu === 'range' ? null : 'range'; renderTopbar(); if (state.menu) ($('#range-menu [aria-checked=true]') || $('#range-menu button')).focus(); },
  'range-set': el => setRange(el.dataset.range),
  'more-toggle': () => { state.menu = state.menu === 'more' ? null : 'more'; renderTopbar(); if (state.menu) $('#more-export').focus(); },
  'export-report': () => { state.menu = null; renderTopbar(); exportDialog(`${PAGES[state.page].title} report`); },
  'print': () => { state.menu = null; renderTopbar(); printDialog(); },
  'export-advanced': () => advancedDialog(),
  'search-clear': () => { state.search = ''; $('#search').value = ''; render(); $('#search').focus(); },
  'log-toggle': () => { state.logOpen = !state.logOpen; renderTopbar(); renderLog(); if (!state.logOpen) $('#log-btn').focus(); },
  'log-clear': () => confirmDialog('Clear the activity log?', 'This removes every recorded event from the log.', 'Clear log', 'danger', () => { state.log = []; renderLogList(); }),
  'log-copy': () => copyLog(),
  'tasks-toggle': () => { state.tasksOpen = !state.tasksOpen; renderTasks(); $('#tasks-toggle').focus(); },
  'task-reveal': el => { const id = el.dataset.id; state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id); renderTasks(); },
  'task-verdict': el => {
    const id = el.dataset.id, pass = el.dataset.v === 'pass';
    if (pass) { const was = state.tasks[id] || {}; state.tasks[id] = null; markTask(id, 'Passed by your verdict.'); state.tasks[id].deletedOnce = was.deletedOnce; renderTasks(); }
    else { state.tasks[id] = {failed:true, deletedOnce:(state.tasks[id] || {}).deletedOnce}; log('result', `Benchmark task ${id} marked as failed`); renderTasks(); }
  },
  'bench-reset': () => confirmDialog('Reset the benchmark?', 'This clears all app data, every task result, the timer and the activity log.', 'Reset benchmark', 'danger', () => {
    while (dialogs.length) dialogs.pop().el.remove();
    clearTimeout(forecastTimer);
    state = freshState(); state.tasksOpen = true;
    $('#search').value = ''; $('#toasts').innerHTML = '';
    render(); renderLog(); renderTasks();
    log('result', 'Benchmark reset');
  }),
  'suggest-go': () => { const s = state.suggestion; state.suggestion = null; log('result', `Followed suggestion: ${s.title}`); s.run(); render(); },
  'suggest-dismiss': () => { log('result', `Dismissed suggestion: ${state.suggestion.title}`); state.suggestion = null; render(); },
  'series': el => { state.series = el.dataset.series; log('result', `Revenue chart shows ${cap(state.series)}`); if (state.series === 'profit') markTask('L2.3'); render(); },
  'toggle-channel': el => {
    const k = el.dataset.key, name = CHANNELS.find(c => c.key === k).name;
    state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k);
    log('result', `${name} slice ${state.hidden.has(k) ? 'hidden' : 'shown'}`);
    if (k === 'email' && state.hidden.has(k)) markTask('L2.4');
    render();
  },
  'growth-tab': el => { state.growthTab = el.dataset.tab; log('result', `Growth tab ${cap(state.growthTab)} shown`); if (state.growthTab === 'retention') markTask('L2.1'); render(); },
  'compare-open': () => openCompare(state.page),
  'compare-close': () => { state.compare = null; render(); },
  'compare-export': el => exportDialog(`${el.dataset.kind === 'growth' ? 'Growth' : 'Overview'} comparison`),
  'sort': el => {
    const k = el.dataset.key;
    state.sort = state.sort.key === k ? {key:k, dir:state.sort.dir === 'asc' ? 'desc' : 'asc'} : {key:k, dir:'asc'};
    state.orderPage = 1; log('result', `Orders sorted by ${k === 'ts' ? 'date' : k === 'id' ? 'order' : k}, ${state.sort.dir === 'asc' ? 'lowest first' : 'highest first'}`);
    checkOrderTasks(); render();
  },
  'filter': el => { const s = el.dataset.status; state.filters.has(s) ? state.filters.delete(s) : state.filters.add(s); state.orderPage = 1; log('result', `Status filter: ${[...state.filters].join(', ') || 'all'}`); checkOrderTasks(); render(); },
  'filter-clear': () => { state.filters.clear(); state.orderPage = 1; render(); },
  'page': el => { const p = el.dataset.p, pages = Math.max(1, Math.ceil(filteredOrders().length / 10)); state.orderPage = p === 'prev' ? Math.max(1, state.orderPage - 1) : p === 'next' ? Math.min(pages, state.orderPage + 1) : +p; log('result', `Orders page ${state.orderPage}`); render(); },
  'open-order': el => openOrder(+el.dataset.id),
  'drawer-close': () => { state.openOrderId = null; render(); },
  'order-invoice': () => {
    const o = currentOrder();
    confirmDialog('Send invoice', `${o.invoiceSentAt ? 'An invoice was already sent on ' + fmtDateTime(o.invoiceSentAt) + '. Send it again' : 'Send the invoice for order #' + o.id + ' (' + gbp2(o.total) + ')'} to ${esc(o.email)}?`, 'Send invoice', 'primary', () => {
      o.invoiceSentAt = Date.now(); o.history.push({t:Date.now(), text:'Invoice sent'});
      toast(`Invoice for order #${o.id} sent to ${o.email} (fake)`);
      if (o.id === 1024) markTask('L3.1');
      render();
    });
  },
  'order-pay': () => { const o = currentOrder(); confirmDialog('Mark as paid', `Record a payment of ${gbp2(o.total)} for order #${o.id}?`, 'Mark as paid', 'primary', () => { o.status = 'Paid'; o.history.push({t:Date.now(), text:'Payment received'}); toast(`Order #${o.id} marked as paid`); render(); }); },
  'order-refund': () => {
    const o = currentOrder();
    confirmDialog('Refund this order?', `Refund ${gbp2(o.total)} to ${esc(o.customer)} for order #${o.id}? You cannot undo this.`, 'Refund order', 'danger', () => {
      o.status = 'Refunded'; o.refundedHere = true; o.history.push({t:Date.now(), text:'Refunded in full'});
      toast(`Order #${o.id} refunded (fake)`);
      suggest({title:'Tell the customer about the refund', text:`Send ${o.customer} a short message about the refund for order #${o.id}.`, button:'Write a message', run:() => messageDialog(o, 'refund')});
      render();
    });
  },
  'order-message': () => { const o = currentOrder(); messageDialog(o, o.status === 'Refunded' ? 'refund' : 'general'); },
  'select-customer': el => selectCustomer(el.dataset.id, el.dataset.src),
  'clear-customer': () => { state.selected = null; state.forecast = null; render(); },
  'customer-orders': () => customerOrders(customerById(state.selected)),
  'customer-forecast': () => {
    const id = state.selected; state.forecast = {id, status:'loading'}; log('result', 'Forecast calculation started'); render();
    clearTimeout(forecastTimer);
    // Delayed text: the result appears 5 seconds later.
    forecastTimer = setTimeout(() => { if (state.forecast && state.forecast.id === id) { state.forecast.status = 'done'; log('result', `Forecast ready for ${customerById(id).name}`); if (state.page === 'customers') render(); } }, 5000);
  },
  'wizard-open': () => { state.wizardOpen = true; state.wizard = freshWizard(); render(); $('#cw-name').focus(); },
  'wizard-cancel': () => { state.wizardOpen = false; state.wizard = freshWizard(); render(); },
  'wizard-back': () => { state.wizard.step--; state.wizard.errors = {}; render(); },
  'wizard-next': () => {
    const e = wizardErrors(); state.wizard.errors = e;
    if (Object.keys(e).length) { log('result', `Wizard blocked: ${Object.values(e).join(' ')}`); render(); const f = $('#content [aria-invalid=true], #content .err'); const inp = f && (f.matches('input,select') ? f : f.closest('fieldset, .field').querySelector('input,select')); if (inp) inp.focus(); return; }
    state.wizard.step++; log('result', `Wizard step ${state.wizard.step} of 4`); render();
  },
  'wizard-launch': () => {
    const w = state.wizard, c = {name:w.name.trim(), goal:w.goal, audiences:w.audiences.slice(), share:w.share, date:w.date, time:w.time, status:w.date === TODAY_ISO ? 'Running' : 'Scheduled', followUp:null};
    state.campaigns.unshift(c); state.wizardOpen = false; state.wizard = freshWizard();
    toast(`Campaign "${c.name}" launched`);
    if (c.name.toLowerCase() === 'winter push' && c.audiences.includes('Trial users')) markTask('L3.3');
    suggest({title:`Add a follow-up email to ${c.name}`, text:'A second email a few days later often lifts results.', button:'Add follow-up email', run:() => followUpDialog(c)});
    render();
  },
  'schedule-share': () => {
    const c = state.campaigns.find(x => x.name === state.schedule);
    confirmDialog('Share the schedule', `Share the schedule for "${esc(c.name)}" with ${TEAM.length} team members by email?`, 'Share schedule', 'primary', () => {
      toast(`Schedule shared with ${TEAM.length} team members (fake)`);
      if (c.name.toLowerCase() === 'winter push' && c.followUp) markTask('L3.4');
    });
  },
  'schedule-close': () => { state.schedule = null; render(); },
  'settings-save': () => {
    const d = state.draft;
    if (!d.name.trim()) { log('result', 'Settings not saved: workspace name is empty'); render(); return; }
    state.settings = {...d, name:d.name.trim()}; state.savedAt = Date.now(); state.justSaved = true;
    log('result', `Settings saved: name "${state.settings.name}", timezone ${state.settings.timezone}, data kept ${state.settings.retention} months`);
    if (state.settings.timezone === 'Europe/London') markTask('L3.7');
    render();
    setTimeout(() => { state.justSaved = false; const b = $('#set-save'); if (b) b.textContent = 'Save changes'; }, 2500);
  },
  'ws-delete': () => {

    const name = state.settings.name;
    openDialog({title:'Delete workspace', body:`<p>This deletes <strong>${esc(name)}</strong> and all its orders, customers and campaigns. You cannot undo this.</p><div class="field"><label for="del-confirm">Type the workspace name to confirm: ${esc(name)}</label><input class="input" id="del-confirm" autocomplete="off" autofocus></div>`,
      actions:[cancelAction, {label:'Delete workspace', cls:'danger', id:'del-go', disabled:true, run:el => {
        if (el.querySelector('#del-confirm').value !== state.settings.name) return false;
        state.deleted = true; state.tasks['L4.9'] = Object.assign(state.tasks['L4.9'] || {}, {deletedOnce:true});
        log('result', 'Workspace deleted (fake)'); render(); renderTasks(); return 'deleted';
      }}]});
  },
  'ws-restore': () => { state.deleted = false; log('result', 'Workspace restored'); render(); },
};
function followUpDialog(c) {
  openDialog({title:`Follow-up email for ${c.name}`, body:`<div class="field"><label for="fu-days">Send the follow-up</label><select class="input" id="fu-days" style="max-width:260px"><option value="2">2 days later</option><option value="5" selected>5 days later</option><option value="7">7 days later</option></select></div><label class="check"><input type="checkbox" id="fu-unopened" checked>Only people who did not open the first email</label>`,
    actions:[cancelAction, {label:'Add follow-up', cls:'primary', id:'fu-add', run:el => {
      c.followUp = {days:+el.querySelector('#fu-days').value, unopened:el.querySelector('#fu-unopened').checked};
      toast(`Follow-up added to "${c.name}"`);
      suggest({title:`Preview the schedule for ${c.name}`, text:'Check every send date before the team sees it.', button:'Preview schedule', run:() => { state.schedule = c.name; if (state.page !== 'campaigns') nav('campaigns'); }});
      render(); return 'added';
    }}]});
}

/* ---------- Event wiring ---------- */
document.addEventListener('click', e => {
  const dl = e.target.closest('[data-dlg]');
  if (dl) {
    const d = dialogs.find(x => x.el === dl.closest('.overlay')), a = d.actions[+dl.dataset.dlg];
    const res = a.run ? a.run(d.el) : 'closed';
    if (res !== false) closeDialog(d, typeof res === 'string' ? res : '');
    return;
  }
  if (e.target.classList.contains('overlay')) { closeDialog(dialogs.find(x => x.el === e.target), 'clicked outside'); return; }
  if (state.menu && !e.target.closest('.menu-wrap')) { state.menu = null; renderTopbar(); }
  const a = e.target.closest('[data-action]');
  if (a) { if (!a.disabled && ACT[a.dataset.action]) ACT[a.dataset.action](a, e); return; }
  const row = e.target.closest('tr[data-row]');
  if (row) row.dataset.row === 'order' ? openOrder(+row.dataset.id) : selectCustomer(row.dataset.id, 'table');
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.ans-form'); if (!f) return;
  e.preventDefault();
  const t = TASKS.find(x => x.id === f.dataset.task), v = f.querySelector('input').value, ok = checkAnswer(t, v);
  if (ok === null) return;
  const prev = state.answers[t.id];
  state.answers[t.id] = {value:v, ok, tries:(prev ? prev.tries : 0) + 1};
  log('result', `Answer for ${t.id} checked: "${v}" is ${ok ? 'right' : 'wrong'}`);
  if (ok) markTask(t.id, `Answer: "${v}".`); else renderTasks();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { state.search = el.value; state.orderPage = 1; render(); return; }
  if (el.dataset.wiz) wizardInput(el);
  if (el.dataset.set) state.draft[el.dataset.set] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.draft) state.drafts[el.dataset.draft] = el.value;
  if (el.id === 'del-confirm') $('#del-go').disabled = el.value !== state.settings.name;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.wiz) wizardInput(el);
  if (el.dataset.set) state.draft[el.dataset.set] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.id === 'log-filter') { state.logFilter = el.value; renderLogList(); }
  if (el.id === 'msg-template') { const d = dialogs[dialogs.length - 1]; if (d && d.tpl) $('#msg-body').value = d.tpl(el.value); }
  if (el.name === 'exp-fmt') { const d = dialogs[dialogs.length - 1]; $('#exp-file').textContent = `${d.base}.${el.value}`; $('#exp-err').hidden = true; }
});
// How the slider is moved: by pointer (drag) or by keys.
document.addEventListener('pointerdown', e => { if (e.target.id === 'cw-share') state.sliderMethod = 'drag'; }, true);
document.addEventListener('keydown', e => {
  if (e.target.id === 'cw-share') state.sliderMethod = 'keyboard';
  if (e.key === 'Escape') {
    if (dialogs.length) { closeDialog(null, 'Escape'); return; }
    if (state.menu) { const b = state.menu === 'range' ? '#range-btn' : '#more-btn'; state.menu = null; renderTopbar(); $(b).focus(); return; }
    if (state.openOrderId) { state.openOrderId = null; render(); return; }
    if (state.logOpen) { state.logOpen = false; renderTopbar(); renderLog(); return; }
  }
  if (state.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...document.querySelectorAll('.menu:not([hidden]) button')], i = items.indexOf(document.activeElement);
    items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); e.preventDefault();
  }
  const row = e.target.closest && e.target.closest('tr[data-row]');
  if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.dataset.row === 'order' ? openOrder(+row.dataset.id) : selectCustomer(row.dataset.id, 'table'); }
});
window.addEventListener('resize', drawRegionCanvas);

/* ---------- Start ---------- */
render(); renderTasks(); renderLog();
log('result', 'Benchmark page loaded');

// The tour button follows Brah: Brah reports its tour state on a read-only local address.
(function followBrah() {
  const button = document.getElementById('watch-brah');
  const line = document.getElementById('brah-state');
  async function poll() {
    try {
      const s = await (await fetch('http://127.0.0.1:47719/tour', { cache: 'no-store' })).json();
      button.classList.toggle('running', s.running);
      button.href = s.running ? 'brah://stop' : 'brah://tour';
      button.textContent = s.running ? `Step ${s.step} of ${s.total} · Stop` : s.finished ? 'Watch again' : 'Watch Brah do it';
      line.textContent = s.running ? `Brah: ${s.doing || s.question}` : s.busy ? 'Brah is busy' : '';
    } catch {
      button.classList.remove('running');
      button.href = 'brah://tour';
      button.textContent = 'Watch Brah do it';
      line.textContent = 'Brah is not running';
    }
  }
  poll();
  setInterval(poll, 1000);
})();
</script>
